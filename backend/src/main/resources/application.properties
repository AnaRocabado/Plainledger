spring.application.name=plainledger

# Database. Defaults match `make dev-db` (local only); Docker Compose and CI override them
# with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/plainledger
spring.datasource.username=plainledger
spring.datasource.password=plainledger

# Errors as RFC 9457 Problem Details; never leak stack traces.
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Only the health endpoint is exposed. Component statuses (not details) are shown so the
# database status is visible to the smoke tests and to Docker healthchecks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
