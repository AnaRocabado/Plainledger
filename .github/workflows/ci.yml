name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check, Error Prone, unit and integration tests
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload traceability evidence and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-backend
          path: |
            backend/target/traceability/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload traceability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-frontend
          path: frontend/test-results/

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Traceability tool tests
        run: make tools-test
      - name: Upload traceability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-tools
          path: tools/traceability/test-results/

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v4
      - name: Build images and start the stack (make up)
        run: make up
      - name: Smoke tests through the web origin
        run: make smoke
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload traceability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-smoke
          path: tools/smoke/test-results/
      - name: Stop the stack
        if: always()
        run: make reset

  traceability:
    name: Traceability gate
    needs: [backend, frontend, tools, stack]
    # Report even when a test job failed, so the matrix shows what broke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*
          path: evidence
      - name: Acceptance criteria -> passing tests
        run: node tools/traceability/check.mjs --evidence evidence --report build/traceability.md
      - name: Upload traceability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability-report
          path: build/traceability.md

  images:
    name: Publish images
    needs: [traceability]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plainledger-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
