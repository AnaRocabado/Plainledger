# One origin for the SPA and the API (ADR-0007): the browser only ever talks to this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API requests go to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoint of Actuator is reachable from outside.
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
